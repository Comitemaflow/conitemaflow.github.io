<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Documento - Maflow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e9eef2;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #075985, #0284c7);
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .9;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .volver {
      display: block;
      text-decoration: none;
      text-align: center;
      background: #075985;
      color: white;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    #pdf-container {
      width: 100%;
    }

    .pagina {
      background: white;
      margin: 0 auto 15px;
      padding: 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    #cargando {
      background: white;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      color: #075985;
    }

    #error {
      display: none;
      background: white;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      color: #b42318;
    }
  </style>
</head>

<body>

<header>
  <h1>📄 Documento de prevención</h1>
  <p>Comité de Empresa Maflow</p>
</header>

<main>

  <a class="volver" href="documentos-prevencion.html">
    ← Volver a documentos
  </a>

  <div id="cargando">
    📖 Cargando documento...
  </div>

  <div id="error">
    ❌ No se ha podido mostrar el documento.
  </div>

  <div id="pdf-container"></div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const parametros =
  new URLSearchParams(window.location.search);

const url =
  parametros.get("url");

const contenedor =
  document.getElementById("pdf-container");

const cargando =
  document.getElementById("cargando");

const error =
  document.getElementById("error");


async function mostrarPDF() {

  if (!url) {
    cargando.style.display = "none";
    error.style.display = "block";
    return;
  }

  try {

    const respuesta = await fetch(url);

if (!respuesta.ok) {
  throw new Error("No se ha podido obtener el PDF");
}

const datos = await respuesta.arrayBuffer();

const partesUrl = new URL(url);
const partes = partesUrl.pathname.split("/documentos/");

if (partes.length < 2) {
  throw new Error("Ruta del documento no válida");
}

const ruta = partes[1];

const respuesta = await fetch(
  "https://gyfzbpvxpklgoxrhvonm.supabase.co/functions/v1/ver-documento?ruta=" +
  encodeURIComponent(ruta)
);

if (!respuesta.ok) {
  throw new Error("No se ha podido obtener el documento");
}

const datos = await respuesta.arrayBuffer();

const pdf =
  await pdfjsLib.getDocument({
    data: datos
  }).promise;

    cargando.style.display = "none";

    for (
      let numero = 1;
      numero <= pdf.numPages;
      numero++
    ) {

      const pagina =
        await pdf.getPage(numero);

      const escala = 1.5;

      const viewport =
        pagina.getViewport({
          scale: escala
        });

      const bloque =
        document.createElement("div");

      bloque.className =
        "pagina";

      const canvas =
        document.createElement("canvas");

      const contexto =
        canvas.getContext("2d");

      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;

      bloque.appendChild(canvas);

      contenedor.appendChild(bloque);

      await pagina.render({
        canvasContext: contexto,
        viewport: viewport
      }).promise;
    }

  } catch (e) {

    console.error(e);

    cargando.style.display = "none";
    error.style.display = "block";
  }

}


mostrarPDF();

</script>

</body>
</html>
