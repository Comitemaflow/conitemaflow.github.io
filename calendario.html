<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendario de la empresa - Maflow</title>

  <style>
    * {
      box-sizing: border-box;

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f9;

    }

      background: linear-gradient(135deg, #075985, #0284c7);
      color: white;
      padding: 25px 20px;

    header p {

      margin: auto;
      padding: 18px;

      border-radius: 18px;

      box-shadow: 0 3px 12px rgba(0,0,0,.08);

    .volver {
      display: block;
      text-decoration: none;

      background: #075985;

      font-weight: bold;
    }

    .calendario {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    .nota {

      padding: 12px;

      border-radius: 10px;
