<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comité de Empresa - Maflow</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #075985, #0284c7);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .9;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .volver {
      display: block;
      text-decoration: none;
      text-align: center;
      background: #075985;
      color: white;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .comite {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    .aviso {
      text-align: center;
      color: #6b7785;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>👥 Comité de Empresa</h1>
  <p>Comité de Empresa Maflow</p>
</header>

<main>

  <a class="volver" href="index.html">
    ← Volver a la página principal
  </a>

  <div class="card">

    <img
      id="imagenComite"
      class="comite"
      src="comite-empresa.png"
      alt="Composición del Comité de Empresa Maflow"
    >

    <p class="aviso">
      Puedes ampliar la imagen con los dedos.
    </p>

  </div>

</main>

<script>

const SUPABASE_URL =
  "https://gyfzbpvxpklgoxrhvonm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Jwx0bD9qPWvaWYiSmlPHZg_U3OlXsbX";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function cargarImagenComite() {

  const imagen =
    document.getElementById("imagenComite");

  const { data, error } =
    await supabaseClient
      .from("comite_imagenes")
      .select("url")
      .eq("tipo", "empresa")
      .eq("activo", true)
      .limit(1)
      .maybeSingle();

  if (error) {
    console.log(
      "No se pudo cargar la imagen de Supabase:",
      error
    );
    return;
  }

  if (data && data.url) {
    imagen.src = data.url;
  }
}

document.addEventListener(
  "DOMContentLoaded",
  cargarImagenComite
);

</script>

</body>
</html>
