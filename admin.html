<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona privada - Comité de Empresa Maflow</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #075985, #0284c7);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .9;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      color: #075985;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #075985;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #064e75;
    }

    .logout {
      background: #dc2626;
    }

    .logout:hover {
      background: #b91c1c;
    }

    .mensaje {
      padding: 12px;
      border-radius: 10px;
      background: #e0f2fe;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🔐 Zona privada</h1>
  <p>Comité de Empresa Maflow</p>
</header>

<main>

  <div class="card">
    <h2>Panel de administración</h2>

    <p>
      Desde aquí podrás gestionar próximamente las noticias,
      documentos, fotografías y calendario de la empresa.
    </p>

    <div style="margin-top:15px;">

  <input
    id="noticiaTitulo"
    type="text"
    placeholder="Título de la noticia"
    style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;"
  >

  <textarea
    id="noticiaContenido"
    placeholder="Escribe aquí el contenido de la noticia..."
    rows="5"
    style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;resize:vertical;"
  ></textarea>

  <input
    id="noticiaFecha"
    type="date"
    style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:10px;"
  >

  <button onclick="guardarNoticia()">
    📢 Publicar noticia
  </button>

  <div
    id="mensajeNoticia"
    style="margin-top:12px;padding:10px;border-radius:10px;background:#e0f2fe;display:none;"
  ></div>

</div>
    <button onclick="alert('Próximamente podrás subir documentos.')">
      📄 Gestionar documentos
    </button>

    <button onclick="alert('Próximamente podrás gestionar fotografías.')">
      📷 Gestionar fotos
    </button>

    <button onclick="alert('Próximamente podrás actualizar el calendario.')">
      📅 Gestionar calendario
    </button>
  </div>

  <div class="card">
    <h2>Sesión</h2>

    <p id="usuario">Comprobando usuario...</p>

    <button class="logout" onclick="cerrarSesion()">
      🚪 Cerrar sesión
    </button>

    <div id="mensaje" class="mensaje"></div>
  </div>

</main>

<script>

const SUPABASE_URL = "https://gyfzbpvxpklgoxrhvonm.supabase.co";

const SUPABASE_KEY = "sb_publishable_Jwx0bD9qPWvaWYiSmlPHZg_U3OlXsbX";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
async function guardarNoticia() {

  const titulo = document.getElementById("noticiaTitulo").value.trim();
  const contenido = document.getElementById("noticiaContenido").value.trim();
  const fecha = document.getElementById("noticiaFecha").value;
  const mensaje = document.getElementById("mensajeNoticia");

  if (!titulo || !contenido || !fecha) {
    mensaje.style.display = "block";
    mensaje.innerText = "⚠️ Completa el título, el contenido y la fecha.";
    return;
  }

  mensaje.style.display = "block";
  mensaje.innerText = "Guardando noticia...";

  const { error } = await supabaseClient
    .from("noticias")
    .insert({
      titulo: titulo,
      contenido: contenido,
      fecha: fecha,
      publicado: true
    });

  if (error) {
    console.error(error);
    mensaje.innerText = "❌ No se ha podido guardar la noticia.";
    return;
  }

  mensaje.innerText = "✅ Noticia publicada correctamente.";

  document.getElementById("noticiaTitulo").value = "";
  document.getElementById("noticiaContenido").value = "";
  document.getElementById("noticiaFecha").value = "";
}
async function comprobarSesion() {

  const { data, error } = await supabaseClient.auth.getSession();

  if (error || !data.session) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("usuario").innerHTML =
    "✅ Sesión iniciada correctamente.";
}

async function cerrarSesion() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";
}

comprobarSesion();

</script>

</body>
</html>
