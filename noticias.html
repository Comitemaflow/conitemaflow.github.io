<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias y comunicados | Comité de Empresa Maflow</title>

<style>
:root {
  --bg: #f4f6f8;
  --card: #fff;
  --text: #17212b;
  --muted: #6b7785;
  --accent: #173f5f;
  --accent2: #20639b;
  --line: #e6e9ed;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
}
.phone {
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  box-shadow: 0 0 35px rgba(0,0,0,.08);
}
header {
  background: linear-gradient(145deg, var(--accent), var(--accent2));
  color: white;
  padding: 26px 22px;
  border-radius: 0 0 28px 28px;
}
.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .8px;
  background: rgba(255,255,255,.14);
  padding: 7px 10px;
  border-radius: 20px;
  margin-bottom: 14px;
}
h1 { font-size: 26px; margin: 0 0 8px; }
header p { font-size: 14px; margin: 0; opacity: .9; }
main { padding: 20px 16px 40px; }
.volver {
  display: inline-block;
  color: var(--accent);
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 20px;
}
.noticia {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 5px 16px rgba(22,34,46,.05);
}
.noticia h2 {
  font-size: 17px;
  line-height: 1.35;
  margin: 0 0 8px;
  overflow-wrap: anywhere;
}
.fecha {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}
.contenido {
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
}
.estado {
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}
.pdf-visor {
  width: 100%;
  height: 70vh;
  min-height: 360px;
  overflow: auto;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #eee;
  padding: 10px;
  text-align: center;
}
.pdf-pagina {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto 12px;
  background: white;
}
.boton-documento {
  display: inline-block;
  background: var(--accent);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 12px;
  overflow-wrap: anywhere;
}
footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding: 10px 16px 30px;
}
@media (min-width: 700px) {
  body { padding: 30px 0; }
  .phone { border-radius: 28px; overflow: hidden; }
}
</style>
</head>

<body>
<div class="phone">

<header>
  <div class="badge">COMITÉ DE EMPRESA</div>
  <h1>📢 Noticias y comunicados</h1>
  <p>Información para los trabajadores de Maflow</p>
</header>

<main>
  <a class="volver" href="index.html">← Volver al inicio</a>
  <div id="lista-noticias" class="estado" aria-live="polite">
    Cargando noticias y comunicados...
  </div>
</main>

<footer>Comité de Empresa Maflow</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
"use strict";

const SUPABASE_URL =
  "https://gyfzbpvxpklgoxrhvonm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Jwx0bD9qPWvaWYiSmlPHZg_U3OlXsbX";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

if (typeof pdfjsLib !== "undefined") {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function crearFecha(fechaTexto) {
  const elemento = document.createElement("div");
  elemento.className = "fecha";

  if (fechaTexto) {
    const partes = fechaTexto.substring(0, 10).split("-");
    elemento.textContent = partes.length === 3
      ? partes[2] + "/" + partes[1] + "/" + partes[0]
      : fechaTexto;
  }

  return elemento;
}

function crearEnlaceDocumento(url) {
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.target = "_blank";
  enlace.rel = "noopener noreferrer";
  enlace.className = "boton-documento";
  enlace.textContent = "Abrir o descargar documento";
  return enlace;
}

  async function mostrarPDF(url, visor) {
  if (typeof pdfjsLib === "undefined") {
    visor.textContent = "No se ha podido cargar el visor de PDF.";
    return;
  }

  try {
    const pdf = await pdfjsLib.getDocument({ url: url }).promise;

    let escalaActual = 1;
    let dibujando = false;
    let renderPendiente = false;

    async function dibujarPaginas() {
      if (dibujando) {
        renderPendiente = true;
        return;
      }

      dibujando = true;
      renderPendiente = false;
      visor.replaceChildren();

      try {
        for (let numero = 1; numero <= pdf.numPages; numero++) {
          const pagina = await pdf.getPage(numero);
          const viewport = pagina.getViewport({
            scale: escalaActual
          });

          const canvas = document.createElement("canvas");
          const contexto = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewport.width * dpr);
          canvas.height = Math.floor(viewport.height * dpr);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";
          canvas.style.maxWidth = "none";
          canvas.style.display = "block";
          canvas.style.margin = "0 auto 12px";
          canvas.style.background = "white";
          canvas.style.boxShadow = "0 1px 5px #999";

          visor.appendChild(canvas);

          await pagina.render({
            canvasContext: contexto,
            viewport: viewport,
            transform: dpr !== 1
              ? [dpr, 0, 0, dpr, 0, 0]
              : undefined
          }).promise;
        }
      } finally {
        dibujando = false;

        if (renderPendiente) {
          renderPendiente = false;
          dibujarPaginas();
        }
      }
    }

    // Ampliar y reducir con dos dedos.
    let distanciaInicialDedos = 0;
    let escalaInicioGesto = 1;
    let temporizadorZoom = null;

    function distanciaEntreDedos(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;

      return Math.sqrt(dx * dx + dy * dy);
    }

    visor.style.touchAction = "pan-x pan-y";

    visor.addEventListener("touchstart", function(event) {
      if (event.touches.length === 2) {
        distanciaInicialDedos = distanciaEntreDedos(
          event.touches
        );
        escalaInicioGesto = escalaActual;
      }
    }, { passive: true });

    visor.addEventListener("touchmove", function(event) {
      if (
        event.touches.length === 2 &&
        distanciaInicialDedos > 0
      ) {
        event.preventDefault();

        const distanciaActual = distanciaEntreDedos(
          event.touches
        );

        escalaActual = Math.max(
          0.5,
          Math.min(
            3,
            escalaInicioGesto *
              distanciaActual / distanciaInicialDedos
          )
        );

        clearTimeout(temporizadorZoom);

        temporizadorZoom = setTimeout(function() {
          dibujarPaginas();
        }, 120);
      }
    }, { passive: false });

    visor.addEventListener("touchend", function(event) {
      if (event.touches.length < 2) {
        distanciaInicialDedos = 0;
        clearTimeout(temporizadorZoom);
        dibujarPaginas();
      }
    }, { passive: true });

    // Ajustar inicialmente el PDF al ancho del visor.
    const primeraPagina = await pdf.getPage(1);
    const viewportBase = primeraPagina.getViewport({
      scale: 1
    });

    const ancho = Math.max(
      240,
      (visor.clientWidth ||
        Math.min(window.innerWidth - 60, 400)) - 22
    );

    escalaActual = Math.min(
      1.5,
      ancho / viewportBase.width
    );

    escalaActual = Math.max(0.5, escalaActual);

    await dibujarPaginas();

  } catch (error) {
    console.error("Error al mostrar el PDF:", error);

    visor.textContent =
      "No se ha podido mostrar el PDF. Puedes utilizar el enlace para abrirlo o descargarlo.";
  }
}

  async function cargarNoticias() {
  const contenedor = document.getElementById("lista-noticias");
  contenedor.textContent = "Cargando noticias y comunicados...";

  try {
    const resultadoNoticias = await supabaseClient
      .from("noticias")
      .select("titulo, contenido, fecha, created_at")
      .eq("publicado", true)
      .order("created_at", { ascending: false });

    if (resultadoNoticias.error) {
      throw resultadoNoticias.error;
    }

    const resultadoDocumentos = await supabaseClient
      .from("documentos")
      .select("id, nombre, url, created_at")
      .eq("categoria", "comunicados")
      .eq("publicado", true)
      .order("created_at", { ascending: false });

    if (resultadoDocumentos.error) {
      throw resultadoDocumentos.error;
    }

    const noticias = resultadoNoticias.data || [];
    const documentos = resultadoDocumentos.data || [];

    contenedor.replaceChildren();

    if (noticias.length === 0 && documentos.length === 0) {
      contenedor.className = "estado";
      contenedor.textContent =
        "Todavía no hay noticias ni comunicados publicados.";
      return;
    }

    contenedor.className = "";

    noticias.forEach(function(noticia) {
      const tarjeta = document.createElement("article");
      tarjeta.className = "noticia";

      const titulo = document.createElement("h2");
      titulo.textContent = noticia.titulo || "Noticia";

      tarjeta.appendChild(titulo);

      tarjeta.appendChild(
        crearFecha(noticia.fecha || noticia.created_at)
      );

      const contenido = document.createElement("p");
      contenido.className = "contenido";
      contenido.textContent = noticia.contenido || "";

      tarjeta.appendChild(contenido);
      contenedor.appendChild(tarjeta);
    });

    documentos.forEach(function(documento) {
      const tarjeta = document.createElement("article");
      tarjeta.className = "noticia";

      const titulo = document.createElement("h2");
      titulo.textContent = "📄 " + (documento.nombre || "Comunicado");

      tarjeta.appendChild(titulo);
      tarjeta.appendChild(crearFecha(documento.created_at));

      const visor = document.createElement("div");
      visor.className = "pdf-visor";
      visor.textContent = "Cargando documento PDF...";
      tarjeta.appendChild(visor);

      const controles = document.createElement("div");
      controles.style.display = "flex";
      controles.style.flexWrap = "wrap";
      controles.style.gap = "8px";
      controles.style.alignItems = "center";

      const botonPantalla = document.createElement("button");
          
      botonPantalla.type = "button";
      botonPantalla.className = "boton-documento";
      botonPantalla.style.border = "0";
      botonPantalla.style.cursor = "pointer";
      botonPantalla.textContent = "Ampliar documento";

      let visorAmpliado = false;

      botonPantalla.addEventListener("click", function() {
        visorAmpliado = !visorAmpliado;

        if (visorAmpliado) {
          visor.style.position = "fixed";
          visor.style.top = "0";
          visor.style.left = "0";
          visor.style.width = "100vw";
          visor.style.height = "100dvh";
          visor.style.maxHeight = "100dvh";
          visor.style.zIndex = "99999";
          visor.style.background = "#eeeeee";
          visor.style.borderRadius = "0";
          visor.style.margin = "0";
          visor.style.padding = "10px";
          visor.style.overflow = "auto";
          visor.style.webkitOverflowScrolling = "touch";

          botonPantalla.textContent = "Cerrar ampliación";
          botonPantalla.style.position = "fixed";
          botonPantalla.style.top = "10px";
          botonPantalla.style.right = "10px";
          botonPantalla.style.zIndex = "100000";
          botonPantalla.style.margin = "0";
        } else {
          visor.style.position = "";
          visor.style.top = "";
          visor.style.left = "";
          visor.style.width = "";
          visor.style.height = "";
          visor.style.maxHeight = "";
          visor.style.zIndex = "";
          visor.style.background = "";
          visor.style.borderRadius = "";
          visor.style.margin = "";
          visor.style.padding = "";
          visor.style.overflow = "";
          visor.style.webkitOverflowScrolling = "";

          botonPantalla.textContent = "Ampliar documento";
          botonPantalla.style.position = "";
          botonPantalla.style.top = "";
          botonPantalla.style.right = "";
          botonPantalla.style.zIndex = "";
          botonPantalla.style.margin = "";
        }
      });
      controles.appendChild(botonPantalla);
      controles.appendChild(crearEnlaceDocumento(documento.url));

      tarjeta.appendChild(controles);
      contenedor.appendChild(tarjeta);

      if (documento.url) {
        mostrarPDF(documento.url, visor);
      } else {
        visor.textContent = "El documento no tiene una dirección válida.";
      }
    });

  } catch (error) {
    console.error("Error al cargar noticias:", error);

    contenedor.className = "estado";
    contenedor.textContent =
      "No se ha podido cargar la información. Inténtalo de nuevo más tarde.";
  }
}

cargarNoticias();
</script>

</body>
</html>
