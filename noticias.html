<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias y comunicados | Comité de Empresa Maflow</title>

<style>
:root {
  --bg: #f4f6f8;
  --card: #fff;
  --text: #17212b;
  --muted: #6b7785;
  --accent: #173f5f;
  --accent2: #20639b;
  --line: #e6e9ed;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
}

.phone {
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  box-shadow: 0 0 35px rgba(0,0,0,.08);
}

header {
  background: linear-gradient(145deg, var(--accent), var(--accent2));
  color: white;
  padding: 26px 22px;
  border-radius: 0 0 28px 28px;
}

.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .8px;
  background: rgba(255,255,255,.14);
  padding: 7px 10px;
  border-radius: 20px;
  margin-bottom: 14px;
}

h1 {
  font-size: 26px;
  margin: 0 0 8px;
}

header p {
  font-size: 14px;
  margin: 0;
  opacity: .9;
}

main {
  padding: 20px 16px 40px;
}

.volver {
  display: inline-block;
  color: var(--accent);
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 20px;
}

.noticia {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 5px 16px rgba(22,34,46,.05);
}

.noticia h2 {
  font-size: 17px;
  line-height: 1.35;
  margin: 0 0 8px;
}

.fecha {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}

.contenido {
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
}

.estado {
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}

footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding: 10px 16px 30px;
}

@media (min-width: 700px) {
  body {
    padding: 30px 0;
  }

  .phone {
    border-radius: 28px;
    overflow: hidden;
  }
}
</style>
</head>

<body>

<div class="phone">

<header>
  <div class="badge">COMITÉ DE EMPRESA</div>
  <h1>📢 Noticias y comunicados</h1>
  <p>Información para los trabajadores de Maflow</p>
</header>

<main>

  <a class="volver" href="index.html">← Volver al inicio</a>

  <div id="lista-noticias" class="estado">
    Cargando noticias y comunicados...
  </div>

</main>

<footer>
  Comité de Empresa Maflow
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://gyfzbpvxpklgoxrhvonm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Jwx0bD9qPWvaWYiSmlPHZg_U3OlXsbX";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function cargarNoticias() {
  const contenedor = document.getElementById("lista-noticias");

  contenedor.replaceChildren();

  const estado = document.createElement("div");
  estado.className = "estado";
  estado.textContent = "Cargando noticias y comunicados...";
  contenedor.appendChild(estado);

  try {
    // Cargar las noticias que ya existían
    const resultadoNoticias = await supabaseClient
      .from("noticias")
      .select("titulo, contenido, fecha, created_at")
      .eq("publicado", true)
      .order("fecha", { ascending: false })
      .order("created_at", { ascending: false });

    // Cargar los comunicados PDF y Word
    const resultadoComunicados = await supabaseClient
      .from("documentos")
      .select("id, nombre, url, created_at")
      .eq("categoria", "comunicados")
      .eq("publicado", true)
      .order("created_at", { ascending: false });

    if (resultadoNoticias.error) {
      console.error("Error al cargar noticias:", resultadoNoticias.error);
    }

    if (resultadoComunicados.error) {
      console.error("Error al cargar comunicados:", resultadoComunicados.error);
    }

    if (resultadoNoticias.error && resultadoComunicados.error) {
      contenedor.textContent =
        "No se han podido cargar las noticias ni los comunicados.";
      return;
    }

    contenedor.replaceChildren();

    const noticias = resultadoNoticias.data || [];
    const comunicados = resultadoComunicados.data || [];

    if (noticias.length === 0 && comunicados.length === 0) {
      contenedor.textContent =
        "Todavía no hay noticias ni comunicados publicados.";
      return;
    }

    // Mostrar las noticias existentes
    noticias.forEach(function(noticia) {
      const tarjeta = document.createElement("article");
      tarjeta.className = "noticia";

      const titulo = document.createElement("h2");
      titulo.textContent = "📌 " + noticia.titulo;

      const fecha = document.createElement("div");
      fecha.className = "fecha";

      const fechaTexto = noticia.fecha || noticia.created_at;

      if (fechaTexto) {
        const partes = fechaTexto.substring(0, 10).split("-");
        fecha.textContent = partes.length === 3
          ? partes[2] + "/" + partes[1] + "/" + partes[0]
          : fechaTexto;
      }

      const contenido = document.createElement("p");
      contenido.className = "contenido";
      contenido.textContent = noticia.contenido || "";

      tarjeta.append(titulo, fecha, contenido);
      contenedor.appendChild(tarjeta);
    });

        // Mostrar los comunicados PDF y Word
    comunicados.forEach(function(comunicado) {
      const tarjeta = document.createElement("article");
      tarjeta.className = "noticia";

      const titulo = document.createElement("h2");
      titulo.textContent = "📄 " + comunicado.nombre;

      const fecha = document.createElement("div");
      fecha.className = "fecha";

      if (comunicado.created_at) {
        const partes = comunicado.created_at.substring(0, 10).split("-");
        fecha.textContent = partes.length === 3
          ? partes[2] + "/" + partes[1] + "/" + partes[0]
          : "";
      }

      tarjeta.append(titulo, fecha);

      const esPDF = comunicado.url &&
        comunicado.url.toLowerCase().split("?")[0].endsWith(".pdf");

      if (esPDF) {
        const visor = document.createElement("iframe");
        visor.src = comunicado.url + "#toolbar=1&navpanes=0";
        visor.title = "Comunicado: " + comunicado.nombre;
        visor.style.cssText =
          "width:100%;height:600px;border:1px solid #ddd;border-radius:10px;background:white;";
        visor.setAttribute("loading", "lazy");

        tarjeta.appendChild(visor);
      } else {
        const aviso = document.createElement("p");
        aviso.className = "contenido";
        aviso.textContent =
          "Este documento Word no se puede mostrar directamente en el visor. Puedes abrirlo desde el siguiente enlace.";
        tarjeta.appendChild(aviso);
      }

      const enlace = document.createElement("a");
      enlace.href = comunicado.url;
      enlace.target = "_blank";
      enlace.rel = "noopener noreferrer";
      enlace.textContent = "Abrir o descargar documento";
      enlace.style.cssText =
        "display:inline-block;background:#173f5f;color:white;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:12px;";

      tarjeta.appendChild(enlace);
      contenedor.appendChild(tarjeta);
    });

  } catch (error) {
    console.error("Error inesperado:", error);
    contenedor.textContent =
      "Ha ocurrido un error al cargar las noticias y los comunicados.";
  }
}

cargarNoticias();
</script>

</body>
</html>
