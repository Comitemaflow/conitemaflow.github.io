<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias y comunicados | Comité de Empresa Maflow</title>

<style>
:root {
  --bg: #f4f6f8;
  --card: #fff;
  --text: #17212b;
  --muted: #6b7785;
  --accent: #173f5f;
  --accent2: #20639b;
  --line: #e6e9ed;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
}
.phone {
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  box-shadow: 0 0 35px rgba(0,0,0,.08);
}
header {
  background: linear-gradient(145deg, var(--accent), var(--accent2));
  color: white;
  padding: 26px 22px;
  border-radius: 0 0 28px 28px;
}
.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .8px;
  background: rgba(255,255,255,.14);
  padding: 7px 10px;
  border-radius: 20px;
  margin-bottom: 14px;
}
h1 { font-size: 26px; margin: 0 0 8px; }
header p { font-size: 14px; margin: 0; opacity: .9; }
main { padding: 20px 16px 40px; }
.volver {
  display: inline-block;
  color: var(--accent);
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 20px;
}
.noticia {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 5px 16px rgba(22,34,46,.05);
}
.noticia h2 {
  font-size: 17px;
  line-height: 1.35;
  margin: 0 0 8px;
  overflow-wrap: anywhere;
}
.fecha {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}
.contenido {
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
}
.estado {
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}
.pdf-visor {
  width: 100%;
  height: 70vh;
  min-height: 360px;
  overflow: auto;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #eee;
  padding: 10px;
  text-align: center;
}
.pdf-pagina {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto 12px;
  background: white;
}
.boton-documento {
  display: inline-block;
  background: var(--accent);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 12px;
  overflow-wrap: anywhere;
}
footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding: 10px 16px 30px;
}
@media (min-width: 700px) {
  body { padding: 30px 0; }
  .phone { border-radius: 28px; overflow: hidden; }
}
</style>
</head>

<body>
<div class="phone">

<header>
  <div class="badge">COMITÉ DE EMPRESA</div>
  <h1>📢 Noticias y comunicados</h1>
  <p>Información para los trabajadores de Maflow</p>
</header>

<main>
  <a class="volver" href="index.html">← Volver al inicio</a>
  <div id="lista-noticias" class="estado" aria-live="polite">
    Cargando noticias y comunicados...
  </div>
</main>

<footer>Comité de Empresa Maflow</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
"use strict";

const SUPABASE_URL =
  "https://gyfzbpvxpklgoxrhvonm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Jwx0bD9qPWvaWYiSmlPHZg_U3OlXsbX";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

if (typeof pdfjsLib !== "undefined") {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function crearFecha(fechaTexto) {
  const elemento = document.createElement("div");
  elemento.className = "fecha";

  if (fechaTexto) {
    const partes = fechaTexto.substring(0, 10).split("-");
    elemento.textContent = partes.length === 3
      ? partes[2] + "/" + partes[1] + "/" + partes[0]
      : fechaTexto;
  }

  return elemento;
}

function crearEnlaceDocumento(url) {
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.target = "_blank";
  enlace.rel = "noopener noreferrer";
  enlace.className = "boton-documento";
  enlace.textContent = "Abrir o descargar documento";
  return enlace;
}

async function mostrarPDF(url, visor) {
  if (typeof pdfjsLib === "undefined") {
    visor.textContent = "No se ha podido cargar el visor de PDF.";
    return;
  }

  try {
    const pdf = await pdfjsLib.getDocument({ url: url }).promise;

    let escalaActual = 1;
    let dibujando = false;
    let renderPendiente = false;

    async function dibujarPaginas() {
      if (dibujando) {
        renderPendiente = true;
        return;
      }
      dibujando = true;
      renderPendiente = false;
      visor.replaceChildren();

      try {
        const anchoDisponible = Math.max(
          240,
          (visor.clientWidth || Math.min(window.innerWidth - 60, 400)) - 22
        );

        for (let numero = 1; numero <= pdf.numPages; numero++) {
          const pagina = await pdf.getPage(numero);
          const viewport = pagina.getViewport({ scale: escalaActual });
          const canvas = document.createElement("canvas");
          const contexto = canvas.getContext("2d");
          const dpr = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewport.width * dpr);
          canvas.height = Math.floor(viewport.height * dpr);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";
          canvas.style.maxWidth = "none";
          canvas.style.display = "block";
          canvas.style.margin = "0 auto 12px";
          canvas.style.background = "white";
          canvas.style.boxShadow = "0 1px 5px #999";

          visor.appendChild(canvas);

          await pagina.render({
            canvasContext: contexto,
            viewport: viewport,
            transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined
          }).promise;
        }
      } finally {
        dibujando = false;
        if (renderPendiente) {
          renderPendiente = false;
          dibujarPaginas();
        }
      }
    }

    // Ampliación con dos dedos en pantallas táctiles.
    let distanciaInicialDedos = 0;
    let escalaInicioGesto = 1;
    let temporizadorZoom = null;

    function distanciaEntreDedos(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    visor.style.touchAction = "pan-x pan-y";
    visor.addEventListener("touchstart", function(event) {
      if (event.touches.length === 2) {
        distanciaInicialDedos = distanciaEntreDedos(event.touches);
        escalaInicioGesto = escalaActual;
      }
    }, { passive: true });

    visor.addEventListener("touchmove", function(event) {
      if (event.touches.length === 2 && distanciaInicialDedos > 0) {
        event.preventDefault();
        const distanciaActual = distanciaEntreDedos(event.touches);
        escalaActual = Math.max(0.5, Math.min(3, escalaInicioGesto * distanciaActual / distanciaInicialDedos));
        clearTimeout(temporizadorZoom);
        temporizadorZoom = setTimeout(function() {
          dibujarPaginas();
        }, 120);
      }
    }, { passive: false });

    visor.addEventListener("touchend", function(event) {
      if (event.touches.length < 2) {
        distanciaInicialDedos = 0;
        clearTimeout(temporizadorZoom);
        dibujarPaginas();
      }
    }, { passive: true });

    const primeraPagina = await pdf.getPage(1);
      const viewportBase = primeraPagina.getViewport({ scale: 1 });
      const ancho = Math.max(
        240,
        (visor.clientWidth || Math.min(window.innerWidth - 60, 400)) - 22
      );

      escalaActual = Math.min(1.5, ancho / viewportBase.width);
      escalaActual = Math.max(0.5, escalaActual);

      await dibujarPaginas();
    };

    const primeraPagina = await pdf.getPage(1);
    const viewportBase = primeraPagina.getViewport({ scale: 1 });
    const ancho = Math.max(
      240,
      (visor.clientWidth || Math.min(window.innerWidth - 60, 400)) - 22
    );

    escalaActual = Math.min(1.5, ancho / viewportBase.width);
    escalaActual = Math.max(0.5, escalaActual);

    await dibujarPaginas();

  } catch (error) {
    console.error("Error al mostrar el PDF:", error);
    visor.textContent =
      "No se ha podido mostrar el PDF. Puedes utilizar el enlace para abrirlo o descargarlo.";
  }
}

async function cargarNoticias() {
  const contenedor = document.getElementById("lista-noticias");

  contenedor.className = "estado";
  contenedor.textContent = "Cargando noticias y comunicados...";

  try {
    const [resultadoNoticias, resultadoComunicados] =
      await Promise.all([
        supabaseClient
          .from("noticias")
          .select("titulo, contenido, fecha, created_at")
          .eq("publicado", true)
          .order("fecha", { ascending: false })
          .order("created_at", { ascending: false }),

        supabaseClient
          .from("documentos")
          .select("id, nombre, url, created_at")
          .eq("categoria", "comunicados")
          .eq("publicado", true)
          .order("created_at", { ascending: false })
      ]);

    if (resultadoNoticias.error) {
      console.error(
        "Error al cargar noticias:",
        resultadoNoticias.error
      );
    }

    if (resultadoComunicados.error) {
      console.error(
        "Error al cargar comunicados:",
        resultadoComunicados.error
      );
    }

    if (resultadoNoticias.error && resultadoComunicados.error) {
      contenedor.className = "estado";
      contenedor.textContent =
        "No se han podido cargar las noticias ni los comunicados. Inténtalo más tarde.";
      return;
    }

    const noticias = resultadoNoticias.data || [];
    const comunicados = resultadoComunicados.data || [];

    contenedor.replaceChildren();
    contenedor.className = "";

    if (noticias.length === 0 && comunicados.length === 0) {
      contenedor.className = "estado";
      contenedor.textContent =
        "Todavía no hay noticias ni comunicados publicados.";
      return;
    }

    // Mostrar las noticias existentes
    noticias.forEach(function(noticia) {
      const tarjeta = document.createElement("article");
      tarjeta.className = "noticia";

      const titulo = document.createElement("h2");
      titulo.textContent = "📌 " + (noticia.titulo || "Noticia");

      tarjeta.appendChild(titulo);
      tarjeta.appendChild(
        crearFecha(noticia.fecha || noticia.created_at)
      );

      const contenido = document.createElement("p");
      contenido.className = "contenido";
      contenido.textContent = noticia.contenido || "";

      tarjeta.appendChild(contenido);
      contenedor.appendChild(tarjeta);
    });

    // Mostrar los comunicados publicados
    comunicados.forEach(function(comunicado) {
      const tarjeta = document.createElement("article");
      tarjeta.className = "noticia";

      const titulo = document.createElement("h2");
      titulo.textContent = "📄 " + (comunicado.nombre || "Comunicado");

      tarjeta.appendChild(titulo);
      tarjeta.appendChild(crearFecha(comunicado.created_at));

      const url = comunicado.url;
      const esPDF = typeof url === "string" &&
        url.toLowerCase().split("?")[0].endsWith(".pdf");

      if (esPDF && url) {
        const zonaPDF = document.createElement("div");
zonaPDF.style.cssText = "margin-top:12px;";

const controlesPDF = document.createElement("div");
controlesPDF.style.cssText =
  "display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:10px;flex-wrap:wrap;";

const botonPantallaCompleta = document.createElement("button");
botonPantallaCompleta.textContent = "⛶ Pantalla completa";

[botonPantallaCompleta].forEach(function(boton) {
  boton.type = "button";
  boton.style.cssText =
    "border:0;border-radius:9px;padding:10px;background:#173f5f;color:white;font-weight:bold;";
});

const visor = document.createElement("div");
visor.className = "pdf-visor";
visor.style.cssText =
  "width:100%;height:70vh;min-height:360px;overflow:auto;border:1px solid #ddd;border-radius:10px;background:#eee;padding:10px;text-align:center;";

controlesPDF.append(botonPantallaCompleta);
zonaPDF.append(controlesPDF, visor);

botonPantallaCompleta.addEventListener("click", async function() {
  try {
    if (!document.fullscreenElement) {
      await zonaPDF.requestFullscreen();
      botonPantallaCompleta.textContent = "⤢ Salir de pantalla completa";
    } else {
      await document.exitFullscreen();
      botonPantallaCompleta.textContent = "⛶ Pantalla completa";
    }
  } catch (error) {
    console.error("No se pudo activar la pantalla completa:", error);
    alert("Tu navegador no permite la pantalla completa en este momento.");
  }
});

document.addEventListener("fullscreenchange", function() {
  if (!document.fullscreenElement) {
    botonPantallaCompleta.textContent = "⛶ Pantalla completa";
  }
});
tarjeta.appendChild(zonaPDF);

visor.textContent = "Cargando documento PDF...";

        // El fallo del visor no impide mostrar el resto de la página.
        mostrarPDF(url, visor);
      } else {
        const aviso = document.createElement("p");
        aviso.className = "contenido";
        aviso.textContent =
          "Este documento no se puede previsualizar aquí. Utiliza el botón para abrirlo o descargarlo.";
        tarjeta.appendChild(aviso);
      }

      if (url) {
        tarjeta.appendChild(crearEnlaceDocumento(url));
      } else {
        const aviso = document.createElement("p");
        aviso.className = "contenido";
        aviso.textContent =
          "Este comunicado no tiene una dirección de archivo disponible.";
        tarjeta.appendChild(aviso);
      }

      contenedor.appendChild(tarjeta);
    });

  } catch (error) {
    console.error(
      "Error inesperado al cargar noticias y comunicados:",
      error
    );

    contenedor.className = "estado";
    contenedor.textContent =
      "Ha ocurrido un error al cargar las noticias y los comunicados. Inténtalo más tarde.";
  }
}

cargarNoticias();
</script>
</body>
</html>
